<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobalTravel Corp - Corporate Travel Portal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%E2%9C%88%3C/text%3E%3C/svg%3E"
    />
    <!--
      Bootstrap 3, vendored into public/ at the cutover.

      Until Increment 6 this pointed at /bower_components/... and reached the
      AngularJS static server through the front-door proxy. That worked in dev
      and silently did NOT work in a production build, where /assets/css/style.css
      resolved to nothing — an inconsistency the proxy had been hiding.

      public/ is served as-is in dev and copied verbatim into the build, so both
      now behave identically. The css/ + fonts/ layout is preserved because
      bootstrap.min.css references ../fonts/glyphicons-* six times.

      ADR-005 carries Bootstrap 3 forward unchanged; replacing it is a separate
      decision, not a smuggled one.
    -->
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
